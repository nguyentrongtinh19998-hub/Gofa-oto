name: Build Gofa Oto APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Tải mã nguồn
        uses: actions/checkout@v4

      - name: 2. Cài đặt Java 17 & Gradle
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 3. Khởi tạo cấu trúc dự án & Thiết kế Icon 
        run: |
          mkdir -p app/src/main/java/vn/navigation/gofaclone
          mkdir -p app/src/main/res/drawable

          cp MainActivity.kt app/src/main/java/vn/navigation/gofaclone/MainActivity.kt

          # Mã đồ họa Vector: Ô tô hồng trên lưng Robot AI
          cat << 'EOF' > app/src/main/res/drawable/ic_app_logo.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <!-- Nền xanh lá Gofa -->
              <path android:fillColor="#0E8A5F" android:pathData="M0,0h108v108h-108z"/>
              <!-- Thân Robot AI -->
              <path android:fillColor="#B0BEC5" android:pathData="M24,54 h60 v40 h-60 z" android:strokeColor="#FFFFFF" android:strokeWidth="2"/>
              <!-- Mắt Robot (Sáng xanh) -->
              <path android:fillColor="#00E5FF" android:pathData="M40,64 a4,4 0 1,0 8,0 a4,4 0 1,0 -8,0" />
              <path android:fillColor="#00E5FF" android:pathData="M60,64 a4,4 0 1,0 8,0 a4,4 0 1,0 -8,0" />
              <!-- Xe Ô tô mini màu hồng trên lưng -->
              <path android:fillColor="#D81B60" android:pathData="M34,34 h40 v16 h-40 z" android:strokeColor="#FFFFFF" android:strokeWidth="2"/>
              <!-- Bánh xe -->
              <path android:fillColor="#212121" android:pathData="M40,50 a4,4 0 1,0 8,0 a4,4 0 1,0 -8,0" />
              <path android:fillColor="#212121" android:pathData="M60,50 a4,4 0 1,0 8,0 a4,4 0 1,0 -8,0" />
              <!-- Kính xe -->
              <path android:fillColor="#81D4FA" android:pathData="M40,38 h28 v6 h-28 z" />
          </vector>
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "GofaOtoFinal"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins { id("com.android.application") version "8.3.0" apply false; id("org.jetbrains.kotlin.android") version "1.9.22" apply false }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "vn.navigation.gofaclone"
              compileSdk = 34
              defaultConfig { applicationId = "vn.navigation.gofaclone"; minSdk = 26; targetSdk = 34; versionCode = 1; versionName = "FINAL-1.0" }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.10" }
          }
          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.02.02")
              implementation(composeBom)
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("org.osmdroid:osmdroid-android:6.1.18")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_app_logo"
                  android:label="Gofa Ô Tô VIP"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:supportsPictureInPicture="true"
                      android:configChanges="screenSize|smallestScreenSize|screenLayout|orientation"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: 4. Biên dịch APK
        run: gradle assembleDebug --no-daemon

      - name: 5. Xuất file APK
        uses: actions/upload-artifact@v4
        with:
          name: Gofa-Oto-VIP-Final
          path: app/build/outputs/apk/debug/app-debug.apk
